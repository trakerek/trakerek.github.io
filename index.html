<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egzamin Zawodowy - Tester</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --error: #c0392b;
            --bg: #ecf0f1;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .quiz-container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
        }
        .select-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #bdc3c7;
            background-color: white;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: var(--primary);
        }
        .question-img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background: white;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }
        .option-btn:hover { background: #f8f9fa; border-color: var(--primary); }
        .option-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Kolory odpowiedzi przy sprawdzaniu */
        .option-btn.correct-show { background: var(--success) !important; color: white; border-color: var(--success); }
        .option-btn.wrong-show { background: var(--error) !important; color: white; border-color: var(--error); }

        .action-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        
        .btn-check { background: var(--success); color: white; width: 100%; font-size: 1.1em; }
        .btn-nav { background: #95a5a6; color: white; }
        .btn-random { background: #f39c12; color: white; }

        #feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }
        .correct-box { background: #d4edda; color: #155724; display: block !important; }
        .wrong-box { background: #f8d7da; color: #721c24; display: block !important; }
        .stats { color: #7f8c8d; margin-bottom: 10px; font-weight: bold; font-size: 1.1em; }
        #dobraodpplus, #dobraodpminus{
            background-color: rgba(255, 127, 127, 1.0);
            font-size: large;
        }
        #zlaodpplus, #zlaodpminus{
            font-size: large;
            background-color: rgba(127,255,127,1.0);

        }

        /* ===== DARK MODE ===== */
        body.dark-mode {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark-mode .quiz-container {
            background: #16213e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            color: #e0e0e0;
        }
        body.dark-mode .select-container {
            background: #16213e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: #e0e0e0;
        }
        body.dark-mode select {
            background-color: #1a1a2e;
            border-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode select:focus {
            border-color: #7f9cf5;
        }
        body.dark-mode .option-btn {
            background: #1a1a2e;
            border-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode .option-btn:hover {
            background: #0f3460;
            border-color: #7f9cf5;
        }
        body.dark-mode .option-btn.selected {
            background: #0f3460;
            border-color: #7f9cf5;
            color: #fff;
        }
        body.dark-mode .stats {
            color: #aaa;
        }
        body.dark-mode .btn-nav {
            background: #2a2a4a;
            color: #e0e0e0;
        }
        body.dark-mode .correct-box {
            background: #1a3a2a;
            color: #7fffb0;
        }
        body.dark-mode .wrong-box {
            background: #3a1a1a;
            color: #ffaaaa;
        }
        body.dark-mode label {
            color: #e0e0e0;
        }
        body.dark-mode #dobraodpplus, body.dark-mode #dobraodpminus {
            background-color: rgba(200, 80, 80, 0.85);
            color: #fff;
        }
        body.dark-mode #zlaodpplus, body.dark-mode #zlaodpminus {
            background-color: rgba(60, 160, 60, 0.85);
            color: #fff;
        }
        body.dark-mode span#dobraodp, body.dark-mode span#zlaodp {
            color: #e0e0e0;
        }

        /* Theme toggle button */
        #themeToggle {
            position:fixed;
            top: 50px;
            right: 400px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            padding: 0;
            background: transparent;
            z-index: 9999;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #themeToggle:hover {
            transform: scale(1.12);
        }
        #themeToggle img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: block;
        }
    </style>
</head>

<div class="select-container">
<p>
    <button id="dobraodpminus">-</button>
    <span id="dobraodp">0</span>
    <button id="dobraodpplus">+</button>
</p>

<p>
    <button id="zlaodpminus">-</button>
    <span id="zlaodp">0</span>
    <button id="zlaodpplus">+</button>
</p>

<script>
    // Funkcja uniwersalna do obsługi licznika
    function ustawLicznik(idPrzyciskMinus, idPrzyciskPlus, idTekstLicznik) {
        const btnMinus = document.getElementById(idPrzyciskMinus);
        const btnPlus = document.getElementById(idPrzyciskPlus);
        const tekstLicznik = document.getElementById(idTekstLicznik);
        
        let stanLicznika = 0;

        // Obsługa kliknięcia w minus
        btnMinus.addEventListener('click', () => {
            stanLicznika--;
            tekstLicznik.textContent = stanLicznika;
        });

        // Obsługa kliknięcia w plus
        btnPlus.addEventListener('click', () => {
            stanLicznika++;
            tekstLicznik.textContent = stanLicznika;
        });
    }

    // Uruchomienie funkcji dla obu par przycisków po załadowaniu strony
    document.addEventListener('DOMContentLoaded', () => {
        ustawLicznik('dobraodpminus', 'dobraodpplus', 'dobraodp');
        ustawLicznik('zlaodpminus', 'zlaodpplus', 'zlaodp');
    });
</script>

    </select>
    <button class="btn-random" id="modeLabel" onclick="toggleRandom()">Tryb: Kolejno</button>

</div>

<div class="quiz-container">
    <div class="stats" id="stats">Pytanie 1</div>
    <img src="" id="qImg" class="question-img" alt="Ładowanie pytania...">

    <div class="options-grid">
        <button class="option-btn" id="btnA" onclick="selectOption('A')">A</button>
        <button class="option-btn" id="btnB" onclick="selectOption('B')">B</button>
        <button class="option-btn" id="btnC" onclick="selectOption('C')">C</button>
        <button class="option-btn" id="btnD" onclick="selectOption('D')">D</button>
    </div>

    <button class="btn-check" onclick="checkAnswer()">SPRAWDŹ ODPOWIEDŹ</button>
    <div id="feedback"></div>

    <div class="action-btns">
        <button class="btn-nav" onclick="prevQ()">Poprzednie</button>
        <button class="btn-nav" onclick="nextQ()">Następne</button>
    </div>
</div>

    let currentExamKey = "exam1";
    let currentIndex = 0;
    let selectedAns = null;
    let isRandom = false;
    let answered = false;

    function initExam() {
        currentIndex = 0;
        loadQuestion();
    }

    function changeExam() {
        currentExamKey = document.getElementById('examSelect').value;
        initExam();
    }

    function loadQuestion() {
        answered = false;
        selectedAns = null;
        
        const exam = exams[currentExamKey];
        const currentPath = exam.questions[currentIndex];

        document.getElementById('qImg').src = currentPath;
        document.getElementById('stats').innerText = `${exam.name} | Pytanie ${currentIndex + 1} z ${exam.questions.length}`;
        
        // Resetowanie stylów wizualnych
        document.getElementById('feedback').style.display = 'none';
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.className = "option-btn";
        });
    }

    function selectOption(val) {
        if (answered) return; // blokada zmiany wyboru po sprawdzeniu odpowiedzi
        selectedAns = val;
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('selected');
            if(btn.innerText === val) btn.classList.add('selected');
        });
    }

    function checkAnswer() {
        if (answered) return;
        if (!selectedAns) {
            alert("Najpierw wybierz odpowiedź!");
            return;
        }
        
        answered = true;
        const exam = exams[currentExamKey];
        const currentPath = exam.questions[currentIndex];
        const correct = exam.answers[currentPath];
        const feedback = document.getElementById('feedback');
        
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('selected');
            // Podświetlenie poprawnej odpowiedzi na zielono
            if (btn.innerText === correct) btn.classList.add('correct-show');
            // Jeśli użytkownik wybrał źle, podświetlamy jego wybór na czerwono
            if (btn.innerText === selectedAns && selectedAns !== correct) btn.classList.add('wrong-show');
        });

        if (selectedAns === correct) {
            feedback.innerText = "BRAWO! To poprawna odpowiedź.";
            feedback.className = "correct-box";
        } else {
            feedback.innerText = `BŁĄD. Poprawna odpowiedź to: ${correct}`;
            feedback.className = "wrong-box";
        }
    }

    function nextQ() {
        if (isRandom) {
            // 1. Pobierz tablicę zawierającą klucze wszystkich egzaminów (np. ["exam1", "exam2", ...])
            const examKeys = Object.keys(exams);
            
            // 2. Wylosuj jeden z egzaminów
            const randomExamKey = examKeys[Math.floor(Math.random() * examKeys.length)];
            
            // 3. Ustaw wylosowany egzamin jako aktywny
            currentExamKey = randomExamKey;
            
            // 4. Zaktualizuj wizualnie listę rozwijaną (select) na stronie
            document.getElementById('examSelect').value = randomExamKey;
            
            // 5. Wylosuj indeks pytania z wybranego egzaminu
            const exam = exams[currentExamKey];
            currentIndex = Math.floor(Math.random() * exam.questions.length);
        } else {
            // Klasyczne przechodzenie kolejno w obrębie jednego egzaminu
            const exam = exams[currentExamKey];
            currentIndex = (currentIndex + 1) % exam.questions.length;
        }
        loadQuestion();
    }

    function prevQ() {
        const exam = exams[currentExamKey];
        currentIndex = (currentIndex - 1 + exam.questions.length) % exam.questions.length;
        loadQuestion();
    }

    function toggleRandom() {
        isRandom = !isRandom;
        document.getElementById('modeLabel').innerText = isRandom ? "Tryb: Losowy" : "Tryb: Kolejno";
    }

    // Pierwsze uruchomienie aplikacji
    window.onload = initExam;
</script>
